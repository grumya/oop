plugins {
    id 'java'
    id 'jacoco'
}

group = 'ru.nsu.msafonova1.task131'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'

    // Отключаем выполнение тестов через командную строку,
    // чтобы избежать багов GradleWorkerMain на Windows
    enabled = false

    finalizedBy jacocoTestReport
}

tasks.withType(Test) {
    systemProperty 'file.encoding', 'UTF-8'
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}
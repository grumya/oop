name: CI Task 1.3.1

on:
  push:
    paths:
      - 'Task_1_3_1/**'
  pull_request:
    paths:
      - 'Task_1_3_1/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task_1_3_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run build and checkstyle
        run: ./gradlew build